services:
  app:
    build: .
    container_name: shop-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: shop
      DB_USERNAME: root
      DB_PASSWORD: root
      INVENTORY_GRPC_TARGET: inventory-service:50051
      INVENTORY_GRPC_TIMEOUT_US: 3000000
    depends_on:
      db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             (php artisan storage:link || true) &&
             php artisan migrate --force &&
             php-fpm"

  nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: shop-db
    environment:
      MYSQL_DATABASE: shop
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 40

  inventory-db:
    image: postgres:17
    container_name: shop-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    volumes:
      - inventorydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-service:
    build:
      context: ./inventory-service
    container_name: shop-inventory-service
    environment:
      DATABASE_URL: postgresql+psycopg://inventory_user:inventory_pass@inventory-db:5432/inventory_db
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
  inventorydata:
